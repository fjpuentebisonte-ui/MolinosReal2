<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal - Molinos Real II</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135673.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .icon-container {
      width: 70px;
      height: 70px;
      background-color: #eff6ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }

    .icon-container img {
      width: 40px;
      height: 40px;
    }

    h1 {
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 30px;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-admin {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-admin:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-vecino {
      background-color: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
    }

    .btn-vecino:hover {
      background-color: #e2e8f0;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-container">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135673.png" alt="Logo">
    </div>
    
    <h1>Molinos Real II</h1>
    <p>Selecciona tu portal para ingresar al sistema</p>

    <div class="buttons-container">
      <a class="btn btn-vecino" href="https://script.google.com/macros/s/AKfycbxhGEOuRkv5ITVJN5sJ8Kssh2oQCQu4gVmCg9PFtTRtaHb1G5pe2c9AZtegUgTYPoLxow/exec?mode=residente">
        🏡 Ingreso Residentes / Vecinos
      </a>

      <a class="btn btn-admin" href="https://script.google.com/macros/s/AKfycbxhGEOuRkv5ITVJN5sJ8Kssh2oQCQu4gVmCg9PFtTRtaHb1G5pe2c9AZtegUgTYPoLxow/exec">
        🔑 Administración
      </a>
    </div>

    <div class="footer">
      Acceso seguro • Fraccionamiento Molinos Real II
    </div>
  </div>

</body>
</html>
